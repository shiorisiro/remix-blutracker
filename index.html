<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DinarsPay Remix - Financial Tracker</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0D0F12" />
    <link rel="apple-touch-icon" href="https://picsum.photos/seed/bluicon/192/192" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        // If we are developing/previewing, unregister active service workers to prevent cached blank screens
        const isDev = window.location.hostname.includes('localhost') || 
                      window.location.hostname.includes('.run.app') || 
                      window.location.hostname.includes('ais-') || 
                      window.location.hostname.includes('web-');
        if (isDev) {
          navigator.serviceWorker.getRegistrations().then(regs => {
            for (let reg of regs) {
              reg.unregister();
            }
          });
          if (window.caches) {
            caches.keys().then(names => {
              for (let name of names) {
                caches.delete(name);
              }
            });
          }
          console.log('Development mode: SW unregistered and caches cleared.');
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('SW registered', reg))
              .catch(err => console.log('SW failed', err));
          });
        }
      }
    </script>
  </body>
</html>

apply plugin: 'com.android.application'

// VERSION_CODE/VERSION_NAME come from the GitHub Actions workflow (tied to the run number)
// so every build installs as an update, never a downgrade. Falls back to 1 / "1.0" for
// local builds where those env vars aren't set. Computed here as plain Groovy variables
// (rather than inline inside the android{} block) to avoid AGP's versionCode/versionName
// property setters choking on a null intermediate value.
def envVersionCode = System.getenv("VERSION_CODE")
def appVersionCode = envVersionCode ? envVersionCode.toInteger() : 1

def envVersionName = System.getenv("VERSION_NAME")
def appVersionName = envVersionName ?: "1.0"

android {
    namespace = "com.blutracker.app"
    compileSdk = rootProject.ext.compileSdkVersion
    
    defaultConfig {
        applicationId "com.blutracker.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // See top of file: appVersionCode/appVersionName are derived from the
        // VERSION_CODE/VERSION_NAME env vars set by the GitHub Actions workflow.
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            // Left intentionally blank. When the build is invoked with
            // -Pandroid.injected.signing.store.file / .store.password / .key.alias / .key.password
            // (as our CI workflow does), AGP transparently substitutes this whole config with
            // those injected values - that substitution only happens if a signingConfig is
            // actually referenced by the build type below. Without this block, the CI
            // properties are silently ignored and the APK comes out unsigned.
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
